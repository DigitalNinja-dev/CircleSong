<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="CircleSong">
  <title>CircleSong</title>
  <defs>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee81f"/>
      <stop offset="0.55" stop-color="#4bd88a"/>
      <stop offset="1" stop-color="#22c8de"/>
    </linearGradient>
    <filter id="glow" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer ring -->
  <circle cx="350" cy="350" r="325" fill="none" stroke="#23292c" stroke-width="22"/>
  <path d="M 36.1 265.9 A 325 325 0 0 1 663.9 265.9" fill="none" stroke="url(#arcGrad)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>

  <!-- position markers -->
  <circle cx="350.0" cy="25.0" r="15" fill="#7ee81f" filter="url(#glow)"/>
  <circle cx="512.5" cy="68.5" r="13" fill="#4bd88a" filter="url(#glow)"/>
  <circle cx="631.5" cy="187.5" r="13" fill="#22c8de" filter="url(#glow)"/>
  <circle cx="675.0" cy="350.0" r="13" fill="#22c8de"/>
  <circle cx="631.5" cy="512.5" r="13" fill="#22c8de"/>
  <circle cx="512.5" cy="631.5" r="13" fill="#2c3337"/>
  <circle cx="350.0" cy="675.0" r="13" fill="#2c3337"/>
  <circle cx="187.5" cy="631.5" r="13" fill="#2c3337"/>
  <circle cx="68.5" cy="512.5" r="13" fill="#22c8de" filter="url(#glow)"/>
  <circle cx="25.0" cy="350.0" r="13" fill="#22c8de" filter="url(#glow)"/>
  <circle cx="68.5" cy="187.5" r="13" fill="#4bd88a" filter="url(#glow)"/>
  <circle cx="187.5" cy="68.5" r="13" fill="#7ee81f" filter="url(#glow)"/>

  <!-- hub -->
  <circle cx="350" cy="350" r="172" fill="#14181b" stroke="#2b3338" stroke-width="3"/>

  <!-- waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M 248 312 c 34,-34 71,-34 105.0,0 s 71,34 105.0,0" stroke="#22c8de" stroke-width="11"/>
    <path d="M 232 352 c 38,-40 82,-40 120.0,0 s 82,40 120.0,0" stroke="#7ee81f" stroke-width="14" filter="url(#softGlow)"/>
    <path d="M 248 392 c 34,-34 71,-34 105.0,0 s 71,34 105.0,0" stroke="#22c8de" stroke-width="11"/>
  </g>
</svg>

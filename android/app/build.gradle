apply plugin: 'com.android.application'

android {
    namespace = "dev.digitalninja.circlesong"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.digitalninja.circlesong"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // The debug key is committed, on purpose, and is not a secret.
        //
        // Without it Gradle signs debug builds with ~/.android/debug.keystore,
        // which it generates on the spot when there is none — and a CI runner
        // is a fresh machine every time. Every build would then carry a
        // different signature, and Android refuses to install an APK over one
        // signed by a different key: the second test build fails with
        // INSTALL_FAILED_UPDATE_INCOMPATIBLE and the app has to be uninstalled
        // first. Pinning one key makes a test build an update rather than a
        // reinstall, which is the whole point of handing someone an APK twice.
        //
        // It carries Android's own published debug credentials and is only ever
        // used for `assembleDebug`. It must never sign a release: that key is
        // the app's identity on Play forever, it lives outside this repository,
        // and it reaches the build through the environment below.
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Release signing comes from the environment, never from the
        // repository. The whole block is conditional so that a checkout without
        // the secrets still builds a debug APK, which is what anyone sideloading
        // wants anyway.
        release {
            def storeFilePath = System.getenv("CIRCLESONG_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("CIRCLESONG_STORE_PASSWORD")
                keyAlias System.getenv("CIRCLESONG_KEY_ALIAS")
                keyPassword System.getenv("CIRCLESONG_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("CIRCLESONG_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

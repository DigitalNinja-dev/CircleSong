# Build the Android app.
#
# The APK is built here rather than on a laptop because a GitHub runner already
# has the Android SDK, and this repo deliberately has no toolchain of its own —
# the web app needs nothing but a browser, and adding a 1 GB SDK to everyone's
# machine to produce one file would be a poor trade.
#
# Every push to a development branch produces a debug APK you can sideload from
# the run's Artifacts. A tagged release additionally produces a signed App
# Bundle, but only if the signing secrets are present, so the workflow still
# succeeds for anyone who has not set them up.
name: Android

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # www/ is generated, so it is not in the repo; Capacitor copies it into
      # the native project. Doing both here keeps the committed Android project
      # free of a duplicated copy of the app.
      - name: Assemble web assets
        run: npm run build:www

      - name: Sync Capacitor
        run: npx cap sync android

      # The single-file build is checked here too: it shares the sources with
      # the app, and the build fails if a module was added without being
      # registered, which would ship an Android app that boots to a blank page.
      - name: Verify the single-file build is current
        run: |
          npm run build
          git diff --exit-code --stat dist/circlesong.html sw.js \
            || (echo "::error::dist/ or sw.js is stale — run npm run build and commit" && exit 1)

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: circlesong-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  bundle:
    # A Play Store upload needs a signed .aab. Runs only for a tag, and only
    # when the signing secrets exist — an unsigned release build is of no use
    # to anyone and a missing secret should not fail the branch builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync android

      - name: Restore the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — skipping the signed bundle."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed bundle
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          CIRCLESONG_STORE_FILE: release.keystore
          CIRCLESONG_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CIRCLESONG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CIRCLESONG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.present == 'true'
        with:
          name: circlesong-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
